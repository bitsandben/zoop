# Zoop release (iOS only): bump the version in project.yml, build the unsigned sideload .ipa, publish a
# non-prerelease `v<VERSION>` GitHub release with it, and prepend that release to altstore-source.json so
# SideStore / AltStore offer it as an update.
#
# The in-app "Check for updates" reads GitHub `releases/latest` (Strand/System/UpdateChecker.swift),
# which excludes prereleases, so this release is what it finds. fork-testing-build.yml's rolling
# `testing-latest` prerelease is untouched.
#
# Run it from GitHub: Actions → "Release Zoop (iOS)" → Run workflow → pick the bump.
name: Release Zoop (iOS)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (patch = 0.0.x, minor = 0.x.0, major = x.0.0, none = rebuild current)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      version:
        description: "Explicit version override, e.g. 1.2.0 (blank = apply the bump above)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-build
  cancel-in-progress: false   # never cancel a release mid-publish

jobs:
  bump:
    runs-on: ubuntu-latest
    # Pushes the version-bump commit to the dispatched branch and creates the GitHub release.
    permissions:
      contents: write
    outputs:
      ver: ${{ steps.b.outputs.ver }}
      tag: ${{ steps.b.outputs.tag }}
      sha: ${{ steps.b.outputs.sha }}
      buildVersion: ${{ steps.b.outputs.buildVersion }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: b
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ github.event.inputs.bump }}
          OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # iOS only: project.yml's MARKETING_VERSION is the version source of truth.
          CUR=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          IFS=. read -r MA MI PA <<< "$CUR"; MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          case "${BUMP:-patch}" in
            major) NEW="$((MA+1)).0.0" ;;
            minor) NEW="${MA}.$((MI+1)).0" ;;
            patch) NEW="${MA}.${MI}.$((PA+1))" ;;
            none|"") NEW="$CUR" ;;
            *) echo "Unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          [ -n "${OVERRIDE:-}" ] && NEW="$OVERRIDE"
          TAG="v${NEW}"
          echo "ver=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $CUR -> $NEW  (tag $TAG)"

          if [ "$NEW" != "$CUR" ]; then
            ICODE=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([0-9]+)".*/\1/')
            sed -i -E "s/MARKETING_VERSION: \"[^\"]+\"/MARKETING_VERSION: \"$NEW\"/" project.yml
            sed -i -E "s/CURRENT_PROJECT_VERSION: \"[0-9]+\"/CURRENT_PROJECT_VERSION: \"$((ICODE+1))\"/" project.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am "Release ${NEW}: bump version (${BUMP})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "buildVersion=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([0-9]+)".*/\1/')" >> "$GITHUB_OUTPUT"

          # Immutable, non-prerelease release so releases/latest returns it. A re-run refreshes the
          # asset instead of recreating the release.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            NOTES_MD="docs/releases/${TAG}.md"
            if [ -f "$NOTES_MD" ]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
                --title "Zoop ${NEW}" --notes-file "$NOTES_MD"
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
                --title "Zoop ${NEW}" --generate-notes
            fi
          fi

  ios:
    needs: bump
    # iOS 26 Liquid Glass (glassEffect) needs the iOS 26 SDK → Xcode 26 → macos-26.
    runs-on: macos-26
    timeout-minutes: 40
    # Uploads the built .ipa to the release created by the `bump` job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - name: Select the newest installed Xcode
        # The app builds against the newest SDK it finds (iOS 27 APIs are compiled in only with Xcode 27).
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build ZoopiOS for device (unsigned, Release)
        # Release, not Debug: a Debug build carries get-task-allow, which makes a re-signed sideload fail
        # "integrity could not be verified" on modern iOS.
        run: >-
          xcodebuild -scheme ZoopiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - name: Package sideload .ipa (no watch app, no widgets) + attach
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app (iphoneos) not found"; exit 1; }
          # The watch app cannot be sideloaded, and widgets are left out so an install needs one App ID.
          rm -rf "$APP/Watch" "$APP/PlugIns/ZoopWidgets.appex"; rmdir "$APP/PlugIns" 2>/dev/null || true
          # Embed the app's capability request (HealthKit, App Group) so SideStore can provision it.
          Tools/prepare-ios-sideload-app.sh "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr "Zoop-ios-v${VER}.ipa" Payload
          gh release upload "$TAG" "Zoop-ios-v${VER}.ipa" --repo "$GITHUB_REPOSITORY" --clobber

  # Prepend this release to the SideStore / AltStore source that SideStore reads from
  # raw.githubusercontent.com/<repo>/main/altstore-source.json.
  sidestore:
    needs: [bump, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main   # SideStore reads the source from main, whatever branch the release ran on.
      - name: Add this release to the source
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
          TAG: ${{ needs.bump.outputs.tag }}
          BUILD: ${{ needs.bump.outputs.buildVersion }}
        run: |
          set -euo pipefail
          IPA="Zoop-ios-v${VER}.ipa"
          SIZE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name=="'"$IPA"'") | .size')
          test -n "$SIZE" || { echo "::error::IPA asset $IPA not found on release $TAG"; exit 1; }
          DATE=$(date -u +%Y-%m-%d)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA}"
          DESC="Zoop ${VER}. See the release notes on GitHub for what changed."
          MINOS=$(jq -r '.apps[0].minOSVersion // "17.0"' altstore-source.json)
          tmp=$(mktemp)
          jq \
            --arg v "$VER" --arg b "$BUILD" --arg d "$DATE" --arg desc "$DESC" \
            --arg url "$URL" --argjson size "$SIZE" --arg min "$MINOS" \
            '
            .apps[0].versions |= ([{
                version: $v, buildVersion: $b, date: $d,
                localizedDescription: $desc, downloadURL: $url, size: $size, minOSVersion: $min
              }] + (map(select(.version != $v))))
            | .apps[0].version            = $v
            | .apps[0].buildVersion       = $b
            | .apps[0].versionDate        = $d
            | .apps[0].versionDescription = $desc
            | .apps[0].downloadURL        = $url
            | .apps[0].size               = $size
            ' altstore-source.json > "$tmp" && mv "$tmp" altstore-source.json
          if git diff --quiet altstore-source.json; then
            echo "altstore-source.json already lists ${VER}."; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add altstore-source.json
          git commit -m "Release ${VER}: add to the SideStore source"
          git pull --rebase origin main
          git push origin HEAD:main
